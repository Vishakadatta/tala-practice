name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in dependencies
        run: npm audit
      - name: Lint
        run: npm run lint
      - name: Integrity, CSP, licenses and code rules
        run: npm run check
