<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-oiLuH2fx3HV7Hk+HcOADVjj22Lq1ekna/a3CdfssRm8=' https://cdn.jsdelivr.net/npm/three@0.187.0/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tala Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=4">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    },
    "integrity": {
      "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.js": "sha384-drH6BueSlcvoXCwAqWkNJvXwu2Ax3mnGOmZnIXaomedIw+uXSP9Bf/XIUINgLUW+",
      "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js": "sha384-T/E3B9AvPtLn5PKD7aTSFqizQcA4kHDfU0lub7u0fvM4w9BMGcSb3yI7r5LqMAMn",
      "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/controls/OrbitControls.js": "sha384-ZVBN/wmVxgX0mUGjFJXakzzdZrAF4g4aHfKyusbjoF0WsVXSoGpeM/qRaVnXtaFo",
      "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/loaders/GLTFLoader.js": "sha384-WH6tljjFikpYMGa2JMqlbJlM1lEMkd/Y6Sqnuog1rX87eShphltUQI5NKByEo4CP",
      "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/utils/BufferGeometryUtils.js": "sha384-NArny884Zj3HwjLRjeY1kbfLZnAHIElzho3N71FW0eMGxxBT+QuLEiSnSgpSaBXh",
      "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/utils/SkeletonUtils.js": "sha384-Pozn8j5+YFr3ak8Pm90ayqDrGYn/DV7vVs/YIIqzJhzeJT0LQksoS1fZQ5lfsYlw"
    }
  }
  </script>
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">&#9776;</button>
  <nav id="sidebar" class="sidebar">
    <h2 class="sidebar-title">Talas</h2>
    <ul id="tala-list" class="tala-list"></ul>
  </nav>

  <main id="main">
    <header id="tala-header">
      <h1 id="tala-name" class="tala-name">Select a tala</h1>
      <p id="tala-info" class="tala-info"></p>
    </header>

    <div id="canvas-wrap" class="canvas-wrap">
      <canvas id="scene"></canvas>
      <button id="reset-view" class="btn-small">Reset view</button>
    </div>

    <div id="anga-strip" class="anga-strip"></div>
    <p id="anga-label" class="anga-label"></p>

    <div id="controls" class="controls">
      <button id="btn-start" class="btn" disabled>Start</button>
      <div class="tempo-group">
        <button class="btn-small tempo-btn" data-delta="-5">-5</button>
        <button class="btn-small tempo-btn" data-delta="-1">-1</button>
        <span id="tempo-display" class="tempo-display">60 BPM</span>
        <button class="btn-small tempo-btn" data-delta="1">+1</button>
        <button class="btn-small tempo-btn" data-delta="5">+5</button>
      </div>
      <div class="control-row">
        <label class="control-label">Nadai
          <select id="nadai-select">
            <option value="3">Tisra (3)</option>
            <option value="4" selected>Chatusra (4)</option>
            <option value="5">Khanda (5)</option>
            <option value="7">Misra (7)</option>
            <option value="9">Sankeerna (9)</option>
          </select>
        </label>
        <label id="kalai-label" class="control-label is-hidden">
          <input type="checkbox" id="kalai-toggle"> 2-Kalai
        </label>
        <label class="control-label">Volume
          <input type="range" id="volume" min="0" max="100" value="70">
        </label>
        <button id="btn-hide-hands" class="btn-small">Hide hands</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/ui.js?v=4"></script>
</body>
</html>
